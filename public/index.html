<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Watch Party</title>

    <script>
        const cssLink = document.createElement("link");
        cssLink.rel = "stylesheet";
        cssLink.href = "/style.css?v=" + new Date().getTime();
        document.head.appendChild(cssLink);
    </script>
</head>
<body>
    <h1>🏴‍☠️ One Piece Watch Hub</h1>
    <div id="timeline">
        <p>Loading schedule...</p>
    </div>

    <script>
        async function loadSchedule() {
            const timeline = document.getElementById('timeline');
            try {
                const res = await fetch('/api/schedule');
                const episodes = await res.json();
                timeline.innerHTML = '';

                if (!episodes || episodes.length === 0) {
                    timeline.innerHTML = '<p>No episodes planned yet!</p>';
                    return;
                }

                // Group episodes by week_id so all weeks render cleanly regardless of SQL row order
                const weeksMap = new Map();
                episodes.forEach(ep => {
                    if (!weeksMap.has(ep.week_id)) {
                        weeksMap.set(ep.week_id, {
                            status: ep.status,
                            watch_date: ep.watch_date,
                            episodes: []
                        });
                    }
                    weeksMap.get(ep.week_id).episodes.push(ep);
                });

                weeksMap.forEach((weekData, weekId) => {
                    // 1. Create the Master Wrapper Card for the week
                    const currentWrapper = document.createElement('div');
                    currentWrapper.className = `week-wrapper wrapper-${weekData.status}`;

                    // 2. Create the Header
                    const weekHeader = document.createElement('div');
                    weekHeader.className = `week-header header-${weekData.status}`;
                    weekHeader.innerHTML = `
                        <h2>🏴‍☠️ ${weekId}</h2>
                        <div class="week-date">${weekData.watch_date ? '📅 ' + weekData.watch_date : '⏳ TBD'}</div>
                    `;

                    // 3. Create the inner container for the episodes
                    const weekContainer = document.createElement('div');
                    weekContainer.className = 'week-container';

                    // 4. Create and append each episode card
                    weekData.episodes.forEach(ep => {
                        let tagsHtml = '';
                        try {
                            const tagsArray = JSON.parse(ep.tags || '[]');
                            tagsArray.forEach(tag => {
                                const safeClass = tag.toLowerCase().replace(/\s+/g, '-');
                                tagsHtml += `<span class="ep-tag tag-${safeClass}">${tag}</span>`;
                            });
                        } catch (e) {
                            console.error("Could not parse tags for episode " + ep.episode_number);
                        }

                        const el = document.createElement('div');
                        el.className = 'episode-card';
                        el.innerHTML = `
                            <div class="ep-num">Ep ${ep.episode_number}</div>
                            <div class="ep-details">
                                <h3>${ep.title || 'Unknown Title'}</h3>
                                <div class="tag-container">
                                    ${tagsHtml}
                                </div>
                            </div>
                        `;
                        weekContainer.appendChild(el);
                    });

                    currentWrapper.appendChild(weekHeader);
                    currentWrapper.appendChild(weekContainer);
                    timeline.appendChild(currentWrapper);
                });
            } catch (err) {
                console.error(err);
                timeline.innerHTML = '<p>Error loading schedule. Is the bot running?</p>';
            }
        }

        loadSchedule();
    </script>
</body>
</html>
