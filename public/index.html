<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Watch Party</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 { color: #89b4fa; text-align: center; margin-bottom: 2rem; }
        .card {
            background-color: #313244;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid #45475a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card.up_next { border-left-color: #a6e3a1; transform: scale(1.02); }
        .card.watched { opacity: 0.6; }
        .header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #45475a; padding-bottom: 0.5rem; margin-bottom: 1rem; }
        .title { font-size: 1.5rem; font-weight: bold; margin: 0; color: #f38ba8; }
        .episodes { font-size: 1.1rem; color: #a6adc8; }
        .tags { margin-bottom: 1rem; }
        .tag {
            background-color: #89b4fa;
            color: #11111b;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 5px;
        }
        .synopsis { line-height: 1.5; color: #bac2de; }
        .badge { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; }
        .badge.up_next { background-color: #a6e3a1; color: #11111b; }
        .badge.watched { background-color: #45475a; color: #cdd6f4; }
        .badge.future { background-color: #f9e2af; color: #11111b; }
    </style>
</head>
<body>

    <h1>🏴‍☠️ One Piece Watch Hub</h1>
    <div id="schedule-container">Loading schedule...</div>

    <script>
        // Fetch data from our Express API
        fetch('/api/schedule')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('schedule-container');
                container.innerHTML = ''; // Clear loading text

                // Sort: watched first, then up_next, then future
                const order = { 'watched': 1, 'up_next': 2, 'future': 3 };
                data.sort((a, b) => order[a.status] - order[b.status]);

                data.forEach(block => {
                    // Create HTML for tags
                    const tagsHtml = block.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

                    // Format the status for display
                    const statusText = block.status.replace('_', ' ');

                    // Build the card
                    const card = `
                        <div class="card ${block.status}">
                            <div class="header">
                                <h2 class="title">${block.title}</h2>
                                <span class="badge ${block.status}">${statusText}</span>
                            </div>
                            <div class="tags">
                                <span class="episodes">Episodes: <strong>${block.episodes}</strong></span> | ${tagsHtml}
                            </div>
                            <div class="synopsis">${block.synopsis}</div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(error => {
                document.getElementById('schedule-container').innerHTML = 'Error loading schedule. Is the bot running?';
            });
    </script>
</body>
</html>
