<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Watch Party</title>

    <script>
        const cssLink = document.createElement("link");
        cssLink.rel = "stylesheet";
        cssLink.href = "/style.css?v=" + new Date().getTime();
        document.head.appendChild(cssLink);
    </script>
</head>
<body>

    <h1>🏴‍☠️ One Piece Watch Hub</h1>
    <div id="timeline">Loading schedule...</div>

    <script>
        async function loadSchedule() {
            try {
                const res = await fetch('/api/schedule');
                const episodes = await res.json();
                const timeline = document.getElementById('timeline');
                timeline.innerHTML = '';

                if (episodes.length === 0) {
                    timeline.innerHTML = '<p>No episodes planned yet!</p>';
                    return;
                }

                let currentWeek = '';
                let currentWrapper = null;
                let weekContainer = null;

                episodes.forEach(ep => {
                    // Check if we have hit a new week batch
                    if (ep.week_id !== currentWeek) {
                        currentWeek = ep.week_id;

                        // 1. Create the Master Wrapper Card for the week
                        currentWrapper = document.createElement('div');
                        currentWrapper.className = `week-wrapper wrapper-${ep.status}`;

                        // 2. Create the Header
                        const weekHeader = document.createElement('div');
                        weekHeader.className = `week-header header-${ep.status}`;
                        weekHeader.innerHTML = `
                            <h2>🏴‍☠️ ${currentWeek}</h2>
                            <div class="week-date">${ep.watch_date ? '📅 ' + ep.watch_date : '⏳ TBD'}</div>
                        `;

                        // 3. Create the inner container for the episodes
                        weekContainer = document.createElement('div');
                        weekContainer.className = 'week-container';

                        // Assemble the pieces into the wrapper, then push it to the timeline
                        currentWrapper.appendChild(weekHeader);
                        currentWrapper.appendChild(weekContainer);
                        timeline.appendChild(currentWrapper);
                    }

                    // 4. Create the episode card
                    const el = document.createElement('div');
                    el.className = `episode-card`;
                    el.innerHTML = `
                        <div class="ep-num">Ep ${ep.episode_number}</div>
                        <div class="ep-details">
                            <h3>${ep.title || 'Unknown Title'}</h3>
                        </div>
                        <div class="ep-status tag-${ep.status}">${ep.status}</div>
                    `;

                    // Add the card to the current week's inner container
                    weekContainer.appendChild(el);
                });
            } catch (err) {
                document.getElementById('timeline').innerHTML = '<p>Error loading schedule. Is the bot running?</p>';
            }
        }

        loadSchedule();
    </script>
</body>
</html>
