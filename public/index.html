<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Watch Party</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <h1>🏴‍☠️ One Piece Watch Hub</h1>
    <div id="schedule-container">Loading schedule...</div>

    <script>
        // Fetch data from our Express API
        fetch('/api/schedule')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('schedule-container');
                container.innerHTML = ''; // Clear loading text

                // Sort: watched first, then up_next, then future
                const order = { 'watched': 1, 'up_next': 2, 'future': 3 };
                data.sort((a, b) => order[a.status] - order[b.status]);

                data.forEach(block => {
                    // Create HTML for tags
                    const tagsHtml = block.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

                    // Format the status for display
                    const statusText = block.status.replace('_', ' ');

                    // Build the card
                    const card = `
                        <div class="card ${block.status}">
                            <div class="header">
                                <h2 class="title">${block.title}</h2>
                                <span class="badge ${block.status}">${statusText}</span>
                            </div>
                            <div class="tags">
                                <span class="episodes">Episodes: <strong>${block.episodes}</strong></span> | ${tagsHtml}
                            </div>
                            <div class="synopsis">${block.synopsis}</div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            })
            .catch(error => {
                document.getElementById('schedule-container').innerHTML = 'Error loading schedule. Is the bot running?';
            });
    </script>
</body>
</html>
