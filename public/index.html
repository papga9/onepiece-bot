<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Watch Party</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <h1>🏴‍☠️ One Piece Watch Hub</h1>
    <div id="timeline">Loading schedule...</div>

    <script>
        fetch('/api/schedule')
            .then(response => response.json())
            .then(data => {
                const timeline = document.getElementById('timeline');
                timeline.innerHTML = '';

                if (data.length === 0) {
                    timeline.innerHTML = '<p>No episodes are currently planned. Check back later!</p>';
                    return;
                }

                data.forEach(item => {
                    let parsedTags = [];
                    try { parsedTags = JSON.parse(item.tags); } catch (e) { parsedTags = []; }

                    const tagsHtml = parsedTags.map(tag => {
                        const cssClass = tag.toLowerCase().replace(' ', '_');
                        return `<span class="tag ${cssClass}">${tag}</span>`;
                    }).join('');

                    // Show the winning date if scheduled, otherwise "TBD"
                    const displayDate = item.watch_date ? item.watch_date : "Date TBD (Voting...)";

                    const block = document.createElement('div');
                    block.className = 'episode-block';
                    block.innerHTML = `
                        <div class="ep-info">
                            <span class="ep-number">EP ${item.episode_number}</span>
                            <span class="ep-week">| ${item.week_id}</span>
                        </div>
                        <div class="ep-title">${item.title}</div>
                        <div class="ep-date">📅 ${displayDate}</div>
                        <div class="ep-tags">${tagsHtml}</div>
                    `;
                    timeline.appendChild(block);
                });
            })
            .catch(error => {
                document.getElementById('timeline').innerHTML = '<p>Error loading schedule. Is the bot running?</p>';
            });
    </script>
</body>
</html>
